name: Validate installer release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate
        required: true
        default: installers-v1

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'installers-')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Download release assets
        run: gh release download "$RELEASE_TAG" --dir release-assets
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify required files and checksums
        shell: pwsh
        run: |
          $required = (Get-Content installers.json | ConvertFrom-Json).installers.asset + "SHA256SUMS"
          foreach ($name in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path "release-assets" $name))) { throw "Missing release asset: $name" }
          }
          Push-Location release-assets
          Get-Content SHA256SUMS | ForEach-Object {
            $hash, $name = $_ -split '\s+', 2
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $name.TrimStart('*')).Hash
            if ($actual -ne $hash) { throw "Checksum mismatch: $name" }
          }
